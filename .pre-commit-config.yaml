repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        name: Ruff lint and auto-fix
        args: [ --fix ]
        exclude: ^pkgs/generated/
      - id: ruff-format
        name: Ruff format
        exclude: ^pkgs/generated/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pkgs/generated/
      - id: end-of-file-fixer
        exclude: ^pkgs/generated/
      - id: pretty-format-json
        args: [ --autofix, --indent=2, --no-sort-keys ]
        exclude: ^pkgs/generated/

  - repo: local
    hooks:
      - id: validate-api-schemas
        name: Validate API JSON schemas
        entry: python scripts/validate_api_schemas.py
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
      - id: check-generated-api-models
        name: Check generated API models are up to date
        entry: bash -c 'bash scripts/tests/generate_api_models.sh && git diff
          --exit-code -- pkgs/generated'
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
      - id: validate-git-tags
        name: Validate git tag format
        entry: python scripts/validate_git_tags.py
        language: system
        pass_filenames: false
        stages: [ pre-commit ]
