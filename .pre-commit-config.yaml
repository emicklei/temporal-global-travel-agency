repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        name: Ruff lint and auto-fix
        args: [--fix]
      - id: ruff-format
        name: Ruff format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]

  - repo: local
    hooks:
      - id: validate-api-schemas
        name: Validate API JSON schemas
        entry: python scripts/validate_api_schemas.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: check-generated-api-models
        name: Check generated API models are up to date
        entry: bash -c 'python scripts/generate_api_models.py && git diff --exit-code -- pkgs/generated'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: validate-git-tags
        name: Validate git tag format
        entry: python scripts/validate_git_tags.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
