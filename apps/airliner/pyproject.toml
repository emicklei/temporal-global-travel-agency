[project]
name = "airliner"
version = "0.1.0"
description = "Airliner app using shared converters package"
authors = [{ name = "monorepo" }]
dependencies = [
	"converters",
	"logger",
	"nexus-rpc>=1.0.0",
	"pydantic>=2.0",
	"temporalio>=1.8.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airliner"]

[tool.uv.sources]
converters = { workspace = true }
