[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logger"
version = "0.1.0"
description = "Temporal activity for logging data as JSON"
requires-python = ">=3.9"
dependencies = [
    "temporalio>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logger"]
