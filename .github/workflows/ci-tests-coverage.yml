name: Tests and Coverage

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check_docs.outputs.docs_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin "${BASE_SHA}"
            fi
            echo "base_ref=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              echo "base_ref=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
            else
              ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
              echo "base_ref=${ROOT_COMMIT}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check for non-documentation changes
        id: check_docs
        shell: bash
        run: |
          BASE_REF="${{ steps.baseline.outputs.base_ref }}"
          NON_DOC_FILES=$(git diff --name-only "${BASE_REF}" HEAD \
            | grep -Ev '\.(md|txt)$' || true)
          if [[ -z "$NON_DOC_FILES" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.docs_only != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 for test execution
        uses: actions/setup-python@v6
        id: python311
        with:
          python-version: "3.11"

      - name: Set up Python 3.9 for Pants bootstrap
        uses: actions/setup-python@v6
        id: python39
        with:
          python-version: "3.9"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install schema2py
        run: |
          go install codeberg.org/emicklei/schema2py@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Pants launcher
        run: chmod +x ./pants

      - name: Resolve comparison baseline
        id: baseline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin "${BASE_SHA}"
            fi
            echo "base_ref=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              echo "base_ref=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
            else
              ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
              echo "base_ref=${ROOT_COMMIT}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate API JSON schemas
        run: bash scripts/validate_api_schemas.sh

      - name: Generate API models
        run: bash scripts/tests/generate_api_models.sh

      - name: Verify generated API models are committed
        run: git diff --exit-code -- pkgs/generated

      - name: Run changed tests with Pants
        shell: bash
        env:
          PYTHON: ${{ steps.python39.outputs.python-path }}
        run: |
          export PATH="$(dirname '${{ steps.python311.outputs.python-path }}'):$PATH"
          BASE_REF="${{ steps.baseline.outputs.base_ref }}"
          echo "Using changed-since baseline: ${BASE_REF}"
          ./pants \
            --changed-since="${BASE_REF}" \
            --changed-dependents=transitive \
            test \
            --use-coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            dist/coverage/python/coverage.xml
            dist/coverage/python/htmlcov/

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: dist/coverage/python/coverage.xml
          slug: emicklei/temporal-global-travel-agency
